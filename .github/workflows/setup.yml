# Timesifier's own workflow, not one Upptime generates: it runs on this run's
# GITHUB_TOKEN with the permissions below and nothing more (README.md).

name: Setup CI
on:
  push:
    branches: [master]
    paths:
      - ".upptimerc.yml"
  workflow_dispatch:
concurrency:
  # One Upptime job at a time, so their commits never race each other.
  group: upptime
  cancel-in-progress: false
permissions:
  # Commits the first results, the README and the graphs.
  contents: write
  issues: write
jobs:
  run:
    name: Set up after a change to .upptimerc.yml
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check every address
        uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # v1.46.5
        with:
          command: "update"
      - name: Record response times
        uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # v1.46.5
        with:
          command: "response-time"
      - name: Update the README
        uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # v1.46.5
        with:
          command: "readme"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Draw graphs
        uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # v1.46.5
        with:
          command: "graphs"
