# Timesifier's own workflow, not one Upptime generates: it runs on this run's
# GITHUB_TOKEN with the permissions below and nothing more (README.md).

name: Static Site CI
on:
  push:
    branches: [master]
    paths:
      - ".upptimerc.yml"
      - "assets/**"
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false
# Nothing by default; each job asks for its own.
permissions: {}
jobs:
  build:
    name: Build the status page
    runs-on: ubuntu-latest
    permissions:
      # Reads this repository; the page itself reads the results from GitHub
      # in the visitor's browser, so it is rebuilt daily, not on every check.
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # v1.46.5
        with:
          command: "site"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Hand the page to GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/status-page/__sapper__/export/
  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
