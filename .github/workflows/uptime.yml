# Timesifier's own workflow, not one Upptime generates: it runs on this run's
# GITHUB_TOKEN with the permissions below and nothing more (README.md).

name: Uptime CI
on:
  schedule:
    # Every 5 minutes, GitHub's shortest schedule. GitHub may start it late
    # when its runners are busy.
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  # One Upptime job at a time, so their commits never race each other.
  group: upptime
  cancel-in-progress: false
permissions:
  # Commits each check's result, and opens and closes an issue for an outage.
  contents: write
  issues: write
jobs:
  run:
    name: Check every address
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Upptime update
        uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # v1.46.5
        with:
          command: "update"
        env:
          GITHUB_TOKEN: ${{ github.token }}
