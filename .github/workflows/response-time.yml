# Timesifier's own workflow, not one Upptime generates: it runs on this run's
# GITHUB_TOKEN with the permissions below and nothing more (README.md).

name: Response Time CI
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
concurrency:
  # One Upptime job at a time, so their commits never race each other.
  group: upptime
  cancel-in-progress: false
permissions:
  # Commits the day's response times.
  contents: write
  issues: read
jobs:
  run:
    name: Record response times
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Upptime response-time
        uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # v1.46.5
        with:
          command: "response-time"
        env:
          GITHUB_TOKEN: ${{ github.token }}
