# Timesifier's status page: https://status.timesifier.com
# Upptime reads this file. https://upptime.js.org/docs/configuration
#
# The workflows in .github/workflows are this repository's own, not the ones
# Upptime generates: they run on the workflow's GITHUB_TOKEN alone, each with
# only the permissions it needs, and every action is pinned to a commit.
# Nothing here rewrites them (Upptime's "Update Template CI" and "Updates CI"
# are left out), so no personal access token is needed. See README.md.

owner: ayoinc
repo: timesifier-status

sites:
  # The application's own check of its database and its files (TS-107a). It
  # answers 503 when either fails, and its body always says which.
  - name: Health
    url: https://timesifier.com/health
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  # The four public pages.
  - name: Home page
    url: https://timesifier.com/
    expectedStatusCodes:
      - 200
  - name: Sign-in page
    url: https://timesifier.com/sign-in
    expectedStatusCodes:
      - 200
  - name: Privacy notice
    url: https://timesifier.com/privacy
    expectedStatusCodes:
      - 200
  - name: Terms
    url: https://timesifier.com/terms
    expectedStatusCodes:
      - 200

# GITHUB_TOKEN cannot change a repository's settings or delete an issue, so
# Upptime is told not to try.
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true
skipDeleteIssues: true

status-website:
  cname: status.timesifier.com
  name: Timesifier status
  logoUrl: /logo.svg
  logoHref: https://timesifier.com
  favicon: /logo-192.png
  faviconSvg: /logo.svg
  introTitle: "Is **Timesifier** up?"
  introMessage: >-
    Checked every 5 minutes from GitHub's servers, outside Cloudflare, where
    Timesifier runs. If this address does not open, the same checks and any
    open incident are at
    [github.com/ayoinc/timesifier-status](https://github.com/ayoinc/timesifier-status).
  navbar:
    - title: Status
      href: /
    - title: Timesifier
      href: https://timesifier.com
    - title: GitHub
      href: https://github.com/ayoinc/timesifier-status
